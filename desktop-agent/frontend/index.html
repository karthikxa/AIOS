<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Use Agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Consolas', monospace; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
header { background: #111; border-bottom: 1px solid #333; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 14px; color: #00ff88; font-weight: 600; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.on { background: #00ff88; animation: pulse 1.5s infinite; }
.status-dot.off { background: #ff4444; }
.status-dot.stream { background: #ffaa00; animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.container { flex: 1; display: flex; overflow: hidden; }
.panel { flex: 1; display: flex; flex-direction: column; }
.panel:first-child { border-right: 1px solid #333; }
.panel-header { background: #111; padding: 8px 12px; font-size: 12px; color: #888; border-bottom: 1px solid #222; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
#chat { flex: 1; overflow-y: auto; padding: 12px; font-size: 12px; line-height: 1.5; }
.msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
.msg.system { background: #1a1a2e; color: #00ff88; border-left: 3px solid #00ff88; }
.msg.thinking { background: #1a1a2e; color: #666; border-left: 3px solid #444; }
.msg.assistant { background: #1a1a2e; color: #e0e0e0; border-left: 3px solid #0088ff; }
.msg.action { background: #1a1a2e; color: #ffaa00; border-left: 3px solid #ffaa00; }
.msg.screen { background: #0d1117; color: #8b949e; border-left: 3px solid #58a6ff; font-size: 11px; }
.msg.error { background: #1a1a2e; color: #ff4444; border-left: 3px solid #ff4444; }
#desktop-canvas { width: 100%; height: 100%; background: #0a0a0a; display: block; object-fit: contain; }
#stream-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #444; font-size: 14px; text-align: center; pointer-events: none; }
.desktop-panel { position: relative; }
.input-bar { background: #111; border-top: 1px solid #333; padding: 8px 12px; display: flex; gap: 8px; }
.input-bar input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px 12px; border-radius: 4px; font-family: inherit; font-size: 13px; }
.input-bar input:focus { outline: none; border-color: #00ff88; }
.input-bar button { background: #00ff88; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
.input-bar button:disabled { background: #333; color: #666; cursor: not-allowed; }
#chat::-webkit-scrollbar { width: 6px; }
#chat::-webkit-scrollbar-track { background: #0a0a0a; }
#chat::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.plan-bar { background: #0d1117; border-bottom: 1px solid #222; padding: 6px 12px; font-size: 11px; color: #58a6ff; max-height: 120px; overflow-y: auto; display: none; white-space: pre-wrap; }
.plan-bar.active { display: block; }
.fps-counter { font-size: 10px; color: #555; }
</style>
</head>
<body>
<header>
  <h1>COMPUTER USE AGENT</h1>
  <span class="status-dot off" id="statusDot"></span>
  <span id="statusText">Disconnected</span>
</header>
<div class="container">
  <div class="panel" style="flex: 0 0 40%;">
    <div class="panel-header">
      <span>Agent Log</span>
      <span id="stepCount" style="color: #00ff88; font-size: 11px;"></span>
    </div>
    <div id="planBar" class="plan-bar"></div>
    <div id="chat"></div>
    <div class="input-bar">
      <input type="text" id="taskInput" placeholder="Enter a task..." />
      <button id="runBtn" onclick="sendTask()">Run</button>
    </div>
  </div>
  <div class="panel desktop-panel">
    <div class="panel-header">
      <span>Desktop (Live Stream)</span>
      <span class="fps-counter" id="fpsCounter"></span>
    </div>
    <div style="flex:1; position:relative; overflow:hidden;">
      <div id="stream-placeholder">Connecting to stream...</div>
      <canvas id="desktop-canvas"></canvas>
    </div>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const taskInput = document.getElementById('taskInput');
const runBtn = document.getElementById('runBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const canvas = document.getElementById('desktop-canvas');
const ctx = canvas.getContext('2d');
const stepCount = document.getElementById('stepCount');
const planBar = document.getElementById('planBar');
const fpsCounter = document.getElementById('fpsCounter');
const placeholder = document.getElementById('stream-placeholder');
let ws, videoWs;
let frameCount = 0, lastFpsTime = Date.now();

// ── Canvas resize ─────────────────────────────────────────────────────────
function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Draw initial "connecting" state on canvas
ctx.fillStyle = '#0a0a0a';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#00ff88';
ctx.font = '24px monospace';
ctx.textAlign = 'center';
ctx.fillText('Connecting to stream...', canvas.width / 2, canvas.height / 2);

// ── WebSocket (commands) ──────────────────────────────────────────────────
function connectCommands() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => {
    statusDot.className = 'status-dot stream';
    statusText.textContent = 'Streaming';
    connectVideo();
  };
  ws.onclose = () => {
    statusDot.className = 'status-dot off';
    statusText.textContent = 'Disconnected';
    if (videoWs) { videoWs.close(); videoWs = null; }
    setTimeout(connectCommands, 3000);
  };
  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      handleMessage(d);
    } catch(err) {}
  };
}

// ── WebSocket (video frames) ──────────────────────────────────────────────
function connectVideo() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  videoWs = new WebSocket(`${proto}//${location.host}/ws/video`);
  videoWs.binaryType = 'blob';

  videoWs.onopen = () => {
    placeholder.style.display = 'none';
  };

  videoWs.onmessage = async (e) => {
    // Binary JPEG frame from server
    const blob = e.data;
    if (!(blob instanceof Blob)) return;

    try {
      const bitmap = await createImageBitmap(blob);
      // Scale to fit canvas while maintaining aspect ratio
      const scale = Math.min(canvas.width / bitmap.width, canvas.height / bitmap.height);
      const w = bitmap.width * scale;
      const h = bitmap.height * scale;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, x, y, w, h);
      bitmap.close();

      // FPS counter
      frameCount++;
      const now = Date.now();
      if (now - lastFpsTime >= 1000) {
        fpsCounter.textContent = `${frameCount} fps`;
        frameCount = 0;
        lastFpsTime = now;
      }
    } catch (err) {
      // Keep last good frame
    }
  };

  videoWs.onclose = () => {
    if (ws && ws.readyState === 1) {
      setTimeout(connectVideo, 1000);
    }
  };
}

function handleMessage(d) {
  if (d.type === 'plan' && d.plan) {
    renderPlan(d.plan);
    return;
  }
  if (d.type === 'screen' && d.step) {
    stepCount.textContent = `Step ${d.step} · ${d.elapsed}s`;
  }
  if (d.type === 'thinking') return;
  addMsg(d.type, d.text);
}

function addMsg(type, text) {
  if (!text) return;
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function renderPlan(plan) {
  if (!plan || plan.length === 0) {
    planBar.classList.remove('active');
    return;
  }
  planBar.classList.add('active');
  const lines = plan.map(st => {
    const icon = {pending: '[ ]', active: '[>]', completed: '[x]', failed: '[!]', skipped: '[-]'}[st.status] || '[ ]';
    return `${icon} #${st.id}: ${st.description}`;
  });
  planBar.textContent = lines.join('\n');
}

function sendTask() {
  const task = taskInput.value.trim();
  if (!task || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'task', text: task }));
  addMsg('system', `Task: ${task}`);
  taskInput.value = '';
  runBtn.disabled = true;
  setTimeout(() => runBtn.disabled = false, 2000);
}

taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTask(); });
connectCommands();
</script>
</body>
</html>
