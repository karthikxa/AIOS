# 4K Virtual Desktop + CUA Agent + noVNC live stream

services:
  # ── 4K Linux Desktop (Xfce + Chromium + noVNC) ─────────────────────
  desktop:
    image: accetto/ubuntu-vnc-xfce-g3:latest
    container_name: zed-desktop-4k
    ports:
      - "6080:6080"
      - "5900:5900"
    environment:
      - USER=testuser
      - PW=desktop
      - DISPLAY_WIDTH=3840
      - DISPLAY_HEIGHT=2160
    shm_size: "2g"
    restart: unless-stopped

  # ── CUA Agent (AI controls the desktop) ─────────────────────────────
  agent:
    build: ./agent
    container_name: zed-desktop-agent
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-no-auth}
      - LLM_MODEL=${LLM_MODEL:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://server-llm-1-0r64.onrender.com/v1}
      - DESKTOP_URL=http://desktop:8080
      - VNC_URL=http://desktop:6080
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - desktop
    restart: unless-stopped
