version: '3.8'

services:
  browser-1:
    build: .
    container_name: zed-browser-1
    ports:
      - "3001:3000"
      - "6901:6901"
      - "6902:6902"
    environment:
      - VNC_PW=${VNC_PASSWORD:-password123}
      - WIDTH=1280
      - HEIGHT=720
      - QUALITY=80
      - FPS=30
    deploy:
      resources:
        limits:
          memory: 450M
    restart: unless-stopped

  browser-2:
