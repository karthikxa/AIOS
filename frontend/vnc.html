<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VNC Desktop</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #status { position: fixed; top: 8px; left: 8px; color: #fff; font: 12px monospace; z-index: 999; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div id="status">Connecting...</div>
<canvas id="canvas" style="display:none;"></canvas>

<script>
(function() {
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  // WebSocket URL goes through the Vite /kasm proxy
  // The proxy rewrites /kasm/* → https://localhost:6901/*
  // and adds Basic Auth headers + ignores SSL errors
  const loc = window.location;
  const wsUrl = (loc.protocol === 'https:' ? 'wss://' : 'ws://') + loc.host + '/kasm/websockify';

  status.textContent = 'Connecting to VNC...';

  // Use raw WebSocket + canvas pixel rendering for maximum compatibility
  // But first try noVNC RFB if available
  function tryNoVNC() {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.5.0/build/rfb.js';
    script.onload = function() {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.5.0/build/novnc.css';
      document.head.appendChild(link);

      canvas.style.display = 'block';

      const rfb = new RFB(canvas, wsUrl, {
        scaleViewport: true,
        resizeSession: true,
        viewOnly: false,
        credentials: { password: 'vncpassword' }
      });

      rfb.addEventListener('connect', function() {
        status.style.display = 'none';
      });
      rfb.addEventListener('disconnect', function(e) {
        status.textContent = 'Disconnected: ' + (e.detail && e.detail.reason || 'unknown');
        status.style.display = 'block';
      });
      rfb.addEventListener('credentialsrequired', function() {
        rfb.sendCredentials({ password: 'vncpassword' });
      });
    };
    script.onerror = function() {
      status.textContent = 'Failed to load noVNC client library';
    };
    document.body.appendChild(script);
  }

  tryNoVNC();
})();
</script>
</body>
</html>
