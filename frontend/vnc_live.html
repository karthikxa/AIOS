<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  iframe,
  img,
  #screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
  }

  img {
    object-fit: contain;
  }

  #screen canvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
  }

  #status {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    color: #fff;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: rgba(0, 0, 0, 0.58);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 9px 14px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="status">Connecting to live desktop...</div>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'sandbox';
  const statusEl = document.getElementById('status');

  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.style.display = 'block';
  }

  function hideStatusSoon() {
    setTimeout(() => {
      statusEl.style.display = 'none';
    }, 900);
  }

  function mountFrame(url) {
    const frame = document.createElement('iframe');
    frame.title = 'Live desktop';
    frame.allow = 'fullscreen; clipboard-read; clipboard-write';
    frame.referrerPolicy = 'no-referrer';
    frame.src = url;
    frame.onload = hideStatusSoon;
    frame.onerror = () => showStatus('Live desktop connection failed');
    document.body.appendChild(frame);
    return frame;
  }

  async function startHfLiveViewer() {
    const baseUrl = (params.get('base') || params.get('sandbox') || '').replace(/\/$/, '');
    if (!baseUrl) {
      showStatus('Missing desktop URL');
      return;
    }

    try {
      const liveUrl = new URL(baseUrl);
      const wsProtocol = liveUrl.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${liveUrl.host}/websockify`;
      const screen = document.createElement('div');
      screen.id = 'screen';
      document.body.appendChild(screen);

      const { default: RFB } = await import('https://cdn.jsdelivr.net/npm/@novnc/novnc@1.5.0/core/rfb.js');
      const rfb = new RFB(screen, wsUrl, { credentials: { password: '' } });
      rfb.scaleViewport = true;
      rfb.resizeSession = false;
      rfb.viewOnly = true;
      rfb.qualityLevel = 6;
      rfb.compressionLevel = 2;
      rfb.addEventListener('connect', hideStatusSoon);
      rfb.addEventListener('disconnect', () => showStatus('Live desktop disconnected'));
      rfb.addEventListener('credentialsrequired', () => rfb.sendCredentials({ password: '' }));
    } catch (error) {
      console.error(error);
      showStatus('Live desktop WebSocket failed');
    }
  }

  function startSandboxFallback() {
    const baseUrl = params.get('sandbox') || '/sandbox';
    const interval = Math.max(parseInt(params.get('interval') || '200', 10), 80);
    const img = document.createElement('img');
    let connected = false;
    let failCount = 0;

    function loadScreenshot() {
      img.onload = function() {
        if (!connected) {
          connected = true;
          hideStatusSoon();
        }
        failCount = 0;
        setTimeout(loadScreenshot, interval);
      };
      img.onerror = function() {
        failCount++;
        connected = false;
        showStatus(`Reconnecting live desktop... (${failCount})`);
        setTimeout(loadScreenshot, Math.min(interval * 4, 3000));
      };
      img.src = `${baseUrl.replace(/\/$/, '')}/v1/browser/screenshot?t=${Date.now()}`;
    }

    document.body.appendChild(img);
    loadScreenshot();
  }

  if (mode === 'hf') {
    startHfLiveViewer();
  } else {
    startSandboxFallback();
  }
})();
</script>
</body>
</html>
