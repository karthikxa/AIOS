<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
  }

  iframe,
  img,
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
  }

  img,
  video {
    object-fit: contain;
  }

  #status {
    position: absolute;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    z-index: 5;
    color: #fff;
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 6px 10px;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="status">Connecting to live desktop...</div>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'sandbox';
  const statusEl = document.getElementById('status');

  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.style.display = 'block';
  }

  function hideStatusSoon() {
    setTimeout(() => {
      statusEl.style.display = 'none';
    }, 900);
  }

  function mountFrame(url) {
    const frame = document.createElement('iframe');
    frame.title = 'Live desktop';
    frame.allow = 'fullscreen; clipboard-read; clipboard-write';
    frame.referrerPolicy = 'no-referrer';
    frame.src = url;
    frame.onload = hideStatusSoon;
    frame.onerror = () => showStatus('Live desktop connection failed');
    document.body.appendChild(frame);
    return frame;
  }

  function startHfLiveViewer() {
    const baseUrl = (params.get('base') || params.get('sandbox') || '').replace(/\/$/, '');
    if (!baseUrl) {
      showStatus('Missing desktop URL');
      return;
    }

    const video = document.createElement('video');
    video.title = 'Live desktop';
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.src = `${baseUrl}/desktop.webm?t=${Date.now()}`;
    video.onloadeddata = hideStatusSoon;
    video.oncanplay = hideStatusSoon;
    video.onplaying = hideStatusSoon;
    video.onerror = () => showStatus('Live desktop video failed');
    document.body.appendChild(video);
  }

  function startSandboxFallback() {
    const baseUrl = params.get('sandbox') || '/sandbox';
    const interval = Math.max(parseInt(params.get('interval') || '200', 10), 80);
    const img = document.createElement('img');
    let connected = false;
    let failCount = 0;

    function loadScreenshot() {
      img.onload = function() {
        if (!connected) {
          connected = true;
          hideStatusSoon();
        }
        failCount = 0;
        setTimeout(loadScreenshot, interval);
      };
      img.onerror = function() {
        failCount++;
        connected = false;
        showStatus(`Reconnecting live desktop... (${failCount})`);
        setTimeout(loadScreenshot, Math.min(interval * 4, 3000));
      };
      img.src = `${baseUrl.replace(/\/$/, '')}/v1/browser/screenshot?t=${Date.now()}`;
    }

    document.body.appendChild(img);
    loadScreenshot();
  }

  if (mode === 'hf') {
    startHfLiveViewer();
  } else {
    startSandboxFallback();
  }
})();
</script>
</body>
</html>
