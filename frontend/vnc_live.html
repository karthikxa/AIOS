<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  #screenImg {
    width: 100%; height: 100%; object-fit: cover; display: block; background: #1a1a2e;
  }
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font: 13px -apple-system, sans-serif; z-index: 999;
    background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 8px;
    text-align: center;
  }
</style>
</head>
<body>
<img id="screenImg" src="about:blank" alt="Screen">
<div id="status">Connecting to desktop...</div>
<script>
(function() {
  const img = document.getElementById('screenImg');
  const statusEl = document.getElementById('status');
  const params = new URLSearchParams(window.location.search);
  const interval = parseInt(params.get('interval') || '200', 10);
  const baseUrl = '/sandbox';
  let connected = false;
  let failCount = 0;

  function loadScreenshot() {
    const url = baseUrl + '/v1/browser/screenshot?t=' + Date.now();
    img.onload = function() {
      if (!connected) {
        connected = true;
        statusEl.style.display = 'none';
      }
      failCount = 0;
      setTimeout(loadScreenshot, interval);
    };
    img.onerror = function() {
      failCount++;
      if (!connected) {
        statusEl.innerHTML = 'Connecting to desktop...<br><span style="font-size:11px;color:#888">Attempt ' + failCount + '</span>';
      } else {
        statusEl.innerHTML = 'Reconnecting...<br><span style="font-size:11px;color:#888">Attempt ' + failCount + '</span>';
        statusEl.style.display = 'block';
        connected = false;
      }
      setTimeout(loadScreenshot, Math.min(interval * 3, 3000));
    };
    img.src = url;
  }

  loadScreenshot();
})();
</script>
</body>
</html>
