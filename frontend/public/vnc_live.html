<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Desktop</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; background: #000; }
  #status { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5;
    color: #fff; font: 12px -apple-system, sans-serif; background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 6px 10px; pointer-events: none; }
</style>
</head>
<body>
<div id="status">Connecting to live desktop...</div>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode') || 'sandbox';
  const statusEl = document.getElementById('status');
  let retryCount = 0;

  function showStatus(text) { statusEl.textContent = text; statusEl.style.display = 'block'; }
  function hideStatusSoon() { setTimeout(() => { statusEl.style.display = 'none'; }, 800); }

  function startHfLiveViewer() {
    let baseUrl = (params.get('base') || '').replace(/\/$/, '');
    if (!baseUrl) { showStatus('Missing desktop URL'); return; }

    const img = document.createElement('img');
    // FIX 4: /screenshot polling first — most stable on HF free tier
    const streamPaths = ['/screenshot', '/stream', '/stream.mjpeg'];
    let pathIndex = 0;
    let pollTimer = null;
    let usingPolling = false;

    function tryStream() {
      const path = streamPaths[pathIndex];
      showStatus(`Connecting... (${path})`);
      img.src = `${baseUrl}${path}?t=${Date.now()}`;
    }

    img.alt = 'Live desktop';
    img.onload = function() {
      hideStatusSoon();
      retryCount = 0;
      // FIX 4: If loaded from /screenshot, keep polling at 150ms for near-smooth playback
      if (streamPaths[pathIndex] === '/screenshot') {
        usingPolling = true;
        if (pollTimer) clearTimeout(pollTimer);
        pollTimer = setTimeout(function poll() {
          img.src = `${baseUrl}/screenshot?t=${Date.now()}`;
          pollTimer = setTimeout(poll, 150);
        }, 150);
      }
    };
    img.onerror = function() {
      if (pollTimer) clearTimeout(pollTimer);
      usingPolling = false;
      retryCount++;
      if (retryCount > 3) {
        pathIndex = (pathIndex + 1) % streamPaths.length;
        retryCount = 0;
      }
      showStatus(`Reconnecting... (${retryCount})`);
      // FIX 3: 300ms retry instead of 1200ms
      setTimeout(tryStream, 300);
    };

    document.body.appendChild(img);
    tryStream();
  }

  function startSandboxFallback() {
    const baseUrl = (params.get('sandbox') || '/sandbox').replace(/\/$/, '');
    const img = document.createElement('img');
    let connected = false;

    function loadScreenshot() {
      img.onload = function() {
        if (!connected) { connected = true; hideStatusSoon(); }
        setTimeout(loadScreenshot, 200);
      };
      img.onerror = function() {
        connected = false;
        showStatus('Reconnecting...');
        setTimeout(loadScreenshot, 2000);
      };
      img.src = `${baseUrl}/v1/browser/screenshot?t=${Date.now()}`;
    }

    document.body.appendChild(img);
    loadScreenshot();
  }

  if (mode === 'hf') {
    startHfLiveViewer();
  } else {
    startSandboxFallback();
  }
})();
</script>
</body>
</html>
