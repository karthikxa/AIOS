<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D9"/>
      <stop offset="100%" stop-color="#003AA8"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#tg)"/>
  <!-- Tencent logo - penguin eye/face simplified -->
  <!-- Outer ring -->
  <circle cx="20" cy="18" r="10" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Face highlight -->
  <ellipse cx="20" cy="18" rx="6" ry="7" fill="white" opacity="0.15"/>
  <!-- Eyes -->
  <circle cx="17" cy="16" r="1.8" fill="white"/>
  <circle cx="23" cy="16" r="1.8" fill="white"/>
  <!-- Beak -->
  <ellipse cx="20" cy="20" rx="2.5" ry="1.5" fill="#FCD34D"/>
  <!-- Bottom T mark -->
  <rect x="13" y="30" width="14" height="2.5" rx="1.25" fill="white"/>
  <rect x="18.5" y="28" width="3" height="5" rx="1.25" fill="white"/>
</svg>
