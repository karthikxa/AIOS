<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VNC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #screen { width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="screen"></div>
<script type="module">
  import RFB from './vnc/core/rfb.js';

  const urlParams = new URLSearchParams(window.location.search);
  const host = urlParams.get('host') || window.location.hostname;
  const port = urlParams.get('port') || '8080';
  const path = urlParams.get('path') || 'websockify';
  const scale = urlParams.get('scale') !== 'false';
  const viewOnly = urlParams.get('view_only') === 'true';

  const wsUrl = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${host}:${port}/${path}`;

  const rfb = new RFB(document.getElementById('screen'), wsUrl, {
    scaleViewport: scale,
    resizeSession: false,
    viewOnly: viewOnly,
    credentials: {}
  });

  rfb.addEventListener('connect', () => {});
  rfb.addEventListener('disconnect', (e) => {
    console.error('VNC disconnected:', e.detail?.reason);
  });
  rfb.addEventListener('credentialsrequired', () => {});
</script>
</body>
</html>
